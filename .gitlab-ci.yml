# ============================================================
# DEPLOY
# ============================================================
deploy-prod:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client tar
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $IP_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - printf 'MYSQL_ROOT_PASSWORD=%s\nMAIL_HOST=%s\nMAIL_PORT=%s\nMAIL_USERNAME=%s\nMAIL_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD" "${MAIL_HOST:-smtp.gmail.com}" "${MAIL_PORT:-587}" "$MAIL_USERNAME" "$MAIL_PASSWORD" > .env
    - ssh $SSH_USER@$IP_SERVER "mkdir -p $DEST_DIR"
    - tar --exclude='backend/target' --exclude='frontend/node_modules' --exclude='frontend/.next' -czf - backend frontend infrastructure | ssh $SSH_USER@$IP_SERVER "tar -xzf - -C $DEST_DIR"
    - scp .env $SSH_USER@$IP_SERVER:$DEST_DIR/.env
    - ssh $SSH_USER@$IP_SERVER "docker volume create group3_mysql_data >/dev/null && docker volume create group3_uploads_data >/dev/null && cd $DEST_DIR && docker compose -f infrastructure/docker/docker-compose.yml up --build -d --remove-orphans"
