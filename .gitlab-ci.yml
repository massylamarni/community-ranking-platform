image: maven:3.9-eclipse-temurin-26

stages:
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - frontend/**/*
        - infrastructure/**/*
        - .gitlab-ci.yml
    - when: never

cache:
  key: maven
  paths:
    - .m2/repository/

# ============================================================
# TEST (BDD / Playwright / JUnit)
# ============================================================
test:
  stage: test
  allow_failure: true
  script:
    - echo "Executing tests and BDD scenarios with Maven"
    - cd backend
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    name: "Cucumber-Report-$CI_COMMIT_REF_SLUG"
    reports:
      junit:
        - backend/target/surefire-reports/*.xml
        - backend/target/failsafe-reports/*.xml
    paths:
      - backend/target/site
      - backend/target/surefire-reports
      - backend/target/failsafe-reports

