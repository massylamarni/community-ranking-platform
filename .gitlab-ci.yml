# ============================================================
# BUILD JAR
# ============================================================
build-jar:
  stage: build
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

# ============================================================
# DOCKER (Push to GitLab Registry)
# ============================================================
docker-build-push:
  stage: docker
  allow_failure: true
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=registry.cr700.ad.univ-fcomte.fr"]
  dependencies:
    - build-jar
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - TAG=${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
    - docker build -t $IMAGE_NAME:$TAG ./backend
    - docker push $IMAGE_NAME:$TAG
    # only main publishes "latest", so feature branches don't overwrite production
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest
      fi

# ============================================================
# DEPLOY
# ============================================================
deploy-prod:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $IP_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$IP_SERVER "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && docker pull $IMAGE_NAME:latest && cd $DEST_DIR && docker compose up -d"
