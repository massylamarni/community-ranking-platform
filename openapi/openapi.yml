openapi: 3.1.0
info:
  title: Works Platform API
  version: "0.2.0"
  description: Contract for the HTTP endpoints currently implemented by the backend.
servers:
  - url: http://localhost:8181

security:
  - sessionCookie: []

tags:
  - name: auth
    description: Registration, session, and password operations.
  - name: profile
    description: Operations on the authenticated user's profile.
  - name: categories
    description: Category operations.
  - name: works
    description: Work creation, retrieval, submission, updates, and deletion.
  - name: moderation
    description: Administrator review of submitted works.
  - name: rankings
    description: Global and per-category ranking operations.
  - name: uploads
    description: Public access to uploaded work images.

paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterUser" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticationUser" }
        "400": { $ref: "#/components/responses/ValidationError400" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginUser" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticationUser" }
        "400": { $ref: "#/components/responses/ValidationError400" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200": { description: Session invalidated; no response body }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204": { description: Password updated; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPassword" }
      responses:
        "202": { description: Request accepted; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPassword" }
      responses:
        "204": { description: Password reset; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /profile:
    get:
      operationId: getOwnProfile
      tags: [profile]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateOwnProfile
      tags: [profile]
      summary: Update the authenticated user's username or email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfile" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      security: []
      responses:
        "200":
          description: Categories as category response DTOs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryResponse" }
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "200":
          description: Created category DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      operationId: getCategoryById
      tags: [categories]
      summary: Get a category and its published works by ID
      security: []
      responses:
        "200":
          description: Category details with published work DTOs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryDetailsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category name (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "200":
          description: Updated category response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError422" }
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin only)
      responses:
        "204": { description: Category deleted; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories/name/{name}:
    get:
      operationId: getCategoryByName
      tags: [categories]
      summary: Get a category and its published works by exact name
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category details with published work DTOs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryDetailsResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories/{id}/works:
    get:
      operationId: getWorksByCategory
      tags: [categories]
      summary: Get published works for a category as OeuvreResponse DTOs
      security: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Spring Data page containing OeuvreResponse DTOs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpringPageOeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /works:
    get:
      operationId: listWorks
      tags: [works]
      summary: List works with optional status, category, and title filters
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WorkStatus" }
        - name: categoryId
          in: query
          required: false
          schema: { type: integer, format: int32 }
        - name: title
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Work response DTOs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createWork
      tags: [works]
      summary: Create a work
      description: Admins may optionally provide category IDs to assign categories immediately. Category IDs must exist and be unique. Non-admin users cannot assign categories during creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkJson" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateWorkMultipart" }
      responses:
        "200":
          description: Created work response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /works/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkId"
    get:
      operationId: getWorkById
      tags: [works]
      summary: Get a work response DTO by ID
      security: []
      responses:
        "200":
          description: Work response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWork
      tags: [works]
      summary: Update a work using JSON
      description: Authors may edit works in created, rejected, or approved status. Editing a rejected or approved work resets its status to created; pending works cannot be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWork" }
      responses:
        "200":
          description: Updated work response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError422" }
    delete:
      operationId: deleteWork
      tags: [works]
      summary: Delete a work (author or admin)
      responses:
        "204": { description: Work deleted; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /works/{id}/image:
    post:
      operationId: uploadWorkImage
      tags: [works]
      summary: Upload or replace a work image
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: Updated work response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /works/{id}/submit:
    post:
      operationId: submitWork
      tags: [works]
      summary: Assign categories to a created work and submit it
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitWork" }
      responses:
        "200":
          description: Submitted work response DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /moderation/works:
    get:
      operationId: getPendingWorks
      tags: [moderation]
      summary: List works awaiting moderation (admin only)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Spring Data page containing OeuvreResponse DTOs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpringPageOeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/works/{workId}/accept:
    post:
      operationId: acceptWork
      tags: [moderation]
      summary: Accept a pending work (admin only)
      parameters:
        - $ref: "#/components/parameters/ModerationWorkId"
      responses:
        "200":
          description: Updated OeuvreResponse DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /moderation/works/{workId}/refuse:
    post:
      operationId: refuseWork
      tags: [moderation]
      summary: Refuse a pending work (admin only)
      parameters:
        - $ref: "#/components/parameters/ModerationWorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefuseWork" }
      responses:
        "200":
          description: Updated OeuvreResponse DTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OeuvreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError422" }

  /rankings:
    get:
      operationId: getRankings
      tags: [rankings]
      summary: Get rankings sorted by score, optionally filtered by category
      description: Returns published works sorted by score in descending order. Can be filtered by category (by categoryId or category name). If no category parameter is specified, returns global ranking. Paginated.
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          description: Category ID to filter by
          schema:
            type: integer
            format: int32
        - name: period
          in: query
          required: false
          description: Time period window for vote aggregation ('day' / 'jour', 'week' / 'semaine', 'month' / 'mois', 'all')
          schema:
            type: string
            enum: [day, week, month, all, jour, semaine, mois]
            default: all
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Spring Data page containing RankingItemResponse DTOs
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SpringPageRankingItemResponse" }

  /rankings/global:
    get:
      operationId: getGlobalRanking
      tags: [rankings]
      summary: Get global ranking of published works sorted by score
      description: Returns all published works across all categories, sorted by score (sum of votes) in descending order. Paginated.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Spring Data page containing RankingItemResponse DTOs
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SpringPageRankingItemResponse" }

  /uploads/works/{filename}:
    get:
      operationId: getWorkImage
      tags: [uploads]
      summary: Retrieve a stored work image
      description: The backend maps files stored by work image uploads to this public path.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404": { description: Image not found }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int32 }
    WorkId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ModerationWorkId:
      name: workId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index used by Spring Pageable.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      description: Number of results per page.
      schema: { type: integer, minimum: 1, default: 20 }
    Sort:
      name: sort
      in: query
      required: false
      description: Spring Pageable sort expression; may be supplied more than once.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }

  responses:
    BadRequest:
      description: Bad request or invalid argument (400)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated (401)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted (403)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (404)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate username, email, or category (409)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Unsupported request content type (415)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError400:
      description: Request validation failed (400)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError422:
      description: Request validation failed (422)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [status, error]
      properties:
        status: { type: integer, example: 400 }
        error: { type: string, example: "Échec de la validation" }
        fields:
          type: object
          additionalProperties: { type: string }

    Role:
      type: string
      enum: [user, admin]

    WorkStatus:
      type: string
      enum: [created, pending, approved, rejected]

    AuthenticationUser:
      type: object
      required: [userId, username]
      properties:
        userId: { type: integer, format: int32 }
        username: { type: string }

    CurrentUser:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }

    RegisterUser:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_]+$"
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginUser:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    ChangePassword:
      type: object
      required: [oldPassword, newPassword, confirmPassword]
      properties:
        oldPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
        confirmPassword: { type: string, minLength: 1 }

    ForgotPassword:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPassword:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
        confirmPassword: { type: string, minLength: 1 }

    OwnProfile:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }

    UpdateProfile:
      type: object
      properties:
        username: { type: [string, "null"], minLength: 2, maxLength: 30 }
        email: { type: [string, "null"], format: email }

    CategoryResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 50 }

    CategoryDetailsResponse:
      type: object
      required: [id, name, works]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 50 }
        works:
          type: array
          items: { $ref: "#/components/schemas/OeuvreResponse" }

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }

    OeuvreResponse:
      type: object
      required:
        [
          id,
          title,
          description,
          status,
          reason,
          author,
          imageUrl,
          categories,
          totalVotes,
        ]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkStatus" }
        reason:
          type: [string, "null"]
          description: Reason provided by an admin when rejecting the work; null otherwise.
        author: { type: string }
        imageUrl: { type: [string, "null"] }
        categories:
          type: array
          items: { type: string }
        totalVotes: { type: integer, format: int32 }

    CreateWorkJson:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, minLength: 1 }
        imageUrl: { type: [string, "null"], maxLength: 255 }
        categoryIds:
          type: array
          description: Optional category IDs to assign immediately; admins only.
          uniqueItems: true
          items: { type: integer, format: int32 }

    CreateWorkMultipart:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, minLength: 1 }
        imageUrl: { type: [string, "null"], maxLength: 255 }
        image: { type: string, format: binary }
        categoryIds:
          type: array
          description: Optional category IDs to assign immediately; admins only.
          uniqueItems: true
          items: { type: integer, format: int32 }

    SubmitWork:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          minItems: 1
          items: { type: integer, format: int32 }

    UpdateWork:
      type: object
      properties:
        title: { type: [string, "null"], maxLength: 150 }
        description: { type: [string, "null"] }

    RefuseWork:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    SpringPageOeuvreResponse:
      type: object
      description: Spring Data Page serialization containing OeuvreResponse DTOs.
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OeuvreResponse" }
        pageable: { type: object, additionalProperties: true }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
        last: { type: boolean }
        size: { type: integer }
        number: { type: integer }
        sort: { type: object, additionalProperties: true }
        numberOfElements: { type: integer }
        first: { type: boolean }
        empty: { type: boolean }
      additionalProperties: true

    RankingItemResponse:
      type: object
      required: [id, title, author, categories, score, position]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        imageUrl: { type: [string, "null"] }
        categories:
          type: array
          items: { type: string }
        score: { type: integer, format: int32 }
        position: { type: integer, format: int32 }

    SpringPageRankingItemResponse:
      type: object
      description: Spring Data Page serialization containing RankingItemResponse DTOs.
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/RankingItemResponse" }
        pageable: { type: object, additionalProperties: true }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }
        last: { type: boolean }
        size: { type: integer }
        number: { type: integer }
        sort: { type: object, additionalProperties: true }
        numberOfElements: { type: integer }
        first: { type: boolean }
        empty: { type: boolean }
      additionalProperties: true
