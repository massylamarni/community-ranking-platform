services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: numero_number_one
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data-net

  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:8180:80"
    networks:
      - data-net

  app:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/numero_number_one?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_DIR: /uploads
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8181:8080"
    volumes:
      - uploads_data:/uploads
    networks:
      - frontend-net
      - data-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider -O /dev/null http://localhost:8080/auth/me 2>&1 | grep -Eq 'HTTP/1.1 (200|401)'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /backend-api
        BACKEND_URL: http://app:8080
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: http://app:8080
      NEXT_PUBLIC_API_BASE_URL: /backend-api
      NEXT_PUBLIC_API_MOCKING: disabled
    ports:
      - "8182:3000"
    networks:
      - frontend-net

volumes:
  mysql_data:
    name: group3_mysql_data
  uploads_data:
    name: group3_uploads_data

networks:
  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.20.0/24
  data-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.21.0/24
